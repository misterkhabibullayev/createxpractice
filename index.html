<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CreateX</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
        />
    </head>
    <body class="relative">
        <header
            class="w-full bg-transparent absolute top-0 left-0"
            id="headerMain"
        ></header>
       
        <main>
            <section
                class="pt-[100px] pb-[80px] bg-[url(Image/HomePagePhoto/background.svg)]"
                id="heroSection"
            ></section>
            <!-- sadsa -->

            <section class="relative" id="whoweare">
                <div class="absolute top-[10%] left-0">
                    <img src="./Image/HomePagePhoto/dots.svg" alt="dots icon" />
                </div>
                <div class="absolute bottom-[5%] right-0">
                    <img
                        src="./Image/HomePagePhoto/circles.svg"
                        alt="sircles icon"
                    />
                </div>
            </section>

            <section id="featuredCoursesSection"></section>

            <section id="ourBenefits" class="pt-[180px] pb-[120px]"></section>

            <section
                id="ourEvents"
                class="py-[80px] bg-[#FFDBD5] relative overflow-hidden"
            ></section>

            <section id="creatXCertificate" class="pt-[120px]"></section>

            <div
                class="bg-[url(./Image/HomePagePhoto/Background_best.svg)] bg-cover bg-center mt-[-60px] pt-[166px] pb-[100px]"
            >
                <section id="bestTutors"></section>
                <section id="testimonials" class="pt-44 pb-24"></section>
            </div>

            <section id="ourBlog" class="pt-[120px] pb-[180px]"></section>
            <section
                id="subscribeSection"
                class="bg-[url('Image/HomePagePhoto/subscribe-bg.png')] flex items-center justify-center bg-bottom bg-cover overflow-hidden bg-no-repeat py-16"
            ></section>
        </main>
        <footer id="footer"></footer>

        <div id="loader" class="fixed top-0 left-0 z-30 w-full h-screen bg-white flex flex-col items-center justify-center gap-4">
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="80"
                height="80"
                viewBox="0 0 24 24"
            >
                <path d="M0 0h24v24H0z" fill="none" />
                <circle cx="12" cy="12" r="0" fill="currentColor">
                    <animate
                        id="SVG0cdVlcnN"
                        fill="freeze"
                        attributeName="r"
                        begin="0;SVGftllRbIv.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="0;11"
                    />
                    <animate
                        fill="freeze"
                        attributeName="opacity"
                        begin="0;SVGftllRbIv.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="1;0"
                    />
                </circle>
                <circle cx="12" cy="12" r="0" fill="currentColor">
                    <animate
                        id="SVGftllRbIv"
                        fill="freeze"
                        attributeName="r"
                        begin="SVG0cdVlcnN.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="0;11"
                    />
                    <animate
                        fill="freeze"
                        attributeName="opacity"
                        begin="SVG0cdVlcnN.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="1;0"
                    />
                </circle>
            </svg>
            <p class="font-[Lato] font-bold text-[20px] leading-[150%] text-[#787A80]">Loading...</p>
        </div>
        <a href="/feed/events/events.html"></a>

        <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
        <script type="module" src="index.js"></script>
    </body>
</html>
