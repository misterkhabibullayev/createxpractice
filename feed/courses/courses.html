<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Courses</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />

        <script>
            tailwind.config = {
                theme: {
                    extend: {
                        screens: {
                            desktop992: "992px",
                        },
                    },
                },
            };
        </script>

        <style>
            body {
                font-family: "Lato", sans-serif;
            }
        </style>
    </head>
    <body>
        <div>
            <header
                class="w-full bg-transparent top-0 left-0"
                id="headerMain"
            ></header>

            <!-- main -->
            <main>
                <!--====================== ONLINE COURSES SECTION ======================-->
                <section class="w-full max-w-[1340px] mx-auto px-5 pt-[80px]">
                    <div class="flex flex-col items-center">
                        <h5
                            id="online-course-badge"
                            class="max-[576px]:text-base max-[576px]:font-bold font-bold leading-[150%] text-[#1E212C] uppercase tracking-[1px]"
                        ></h5>

                        <p
                            id="online-course-title"
                            class="mt-2 max-[576px]:text-3xl max-[576px]:font-black font-extrabold lg:text-[2.875rem] leading-[130%] text-[##1E212C]"
                        ></p>
                    </div>

                    <div
                        class="flex items-center justify-between max-[576px]:mt-6 lg:mt-16 mb-14 max-[576px]:flex-col max-[576px]:gap-6 max-[576px]:px-4"
                    >
                        <div
                            id="categories"
                            class="flex items-center gap-3 font-bold leading-[160%] max-[520px]:max-w-[300px] max-[520px]:gap-1 max-w-[475px] text-[#9A9CA5] overflow-x-auto custom-scrollbar pb-2 flex-1 pr-3 xl:overflow-x-hidden xl:max-w-[100%]"
                        ></div>

                        <div
                            class="border max-[576px]:ml-[0px] max-[576px]:w-full border-[#D7DADD] rounded flex items-center ml-[30px] md:ml-[100px]"
                        >
                            <input
                                class="px-4 py-2 outline-none min-w-[100px] md:max-w-[150px] max-[576px]:w-full"
                                type="text"
                                name=""
                                id=""
                                placeholder="Search course..."
                            />

                            <button
                                type="submit"
                                class="group px-5 py-1 rounded-r-lg transition-colors duration-300 ease-in-out hover:border-red-500"
                            >
                                <!-- SVG Search Icon -->
                                <svg
                                    xmlns="http://w3.org"
                                    fill="none"
                                    viewBox="0 0 24 24"
                                    stroke-width="2.0"
                                    stroke="currentColor"
                                    class="w-5 h-5 text-gray-500 transition-colors duration-300 ease-in-out group-hover:text-red-600"
                                >
                                    <path
                                        stroke-linecap="round"
                                        stroke-linejoin="round"
                                        d="m21 21-5.197-5.197m0 0A7.5 7.5 0 1 0 5.196 5.196a7.5 7.5 0 0 0 10.604 10.604Z"
                                    />
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- TUTORS PART STARTS - where all people -->
                    <div
                        id="tutors"
                        class="grid grid-cols-1 gap-y-4 gap-x-3 min-[576px]:grid-cols-2 md:grid-cols-2 desktop992:grid-cols-3 lg:grid-cols-3 lg:gap-x-7"
                    ></div>
                </section>
                <!--====================== ONLINE COURSES SECTION ======================-->

                <!-- ====================== TESTIMONIALS SECTION  ====================== -->
                <section class="mt-[120px] bg-[rgb(240,240,240)]">
                    <div
                        class="w-full max-w-[1340px] mx-auto px-5 flex flex-col items-center justify-center pt-24 xl:pb-12"
                    >
                        <div class="relative w-full">
                            <h6
                                id="testimonials-badge"
                                class="w-full text-center font-bold leading-[150%] tracking-[1px] text-[#1E212C] mb-2"
                            ></h6>

                            <h1
                                id="testimonials-description"
                                class="text-center text-2xl mb-12 pb-2 font-black sm:text-3xl md:text-3xl lg:text-4xl xl:text-5xl leading-[130%] text-[#1E212C]"
                            ></h1>

                            <!-- slider -->

                            <div
                                class="slider-wrapper flex items-center justify-center max-w-full pb-6"
                            >
                                <!-- Next Btn -->
                                <div
                                    id="nextBtn"
                                    class="absolute w-10 h-10 z-50 rounded-full bg-transparent text-black hidden md:-right-[50px] min-[992px]:right-[20px] lg:top-[280px] lg:right-[50px] xl:top-[280px] xl:right-10 md:flex md:items-center md:justify-center cursor-pointer hover:bg-[#FF3F3A] hover:text-white transition-colors duration-300 active:scale-105 select-none"
                                >
                                    <p class="text-2xl">→</p>
                                </div>

                                <!-- circle image -->
                                <div
                                    class="absolute sm:-left-[80px] md:-left-[0px] lg:-left-[0px] xl:top-[255px] xl:-left-[15px]"
                                >
                                    <img
                                        src="../../Image/courses-photo/slider-image/circles.png"
                                        alt=""
                                    />
                                </div>

                                <!-- prev Btn -->
                                <div
                                    id="prevBtn"
                                    class="absolute w-10 h-10 z-50 rounded-full md:flex md:items-center md:justify-center bg-transparent text-black hidden md:-left-[50px] min-[992px]:left-[20px] lg:top-[280px] lg:left-[50px] xl:left-10 xl:top-[280px] cursor-pointer hover:bg-[#FF3F3A] hover:text-white transition-colors duration-300 active:scale-105 select-none"
                                >
                                    <p class="text-2xl">←</p>
                                </div>

                                <div
                                    class="view-port overflow-hidden max-w-[437px] sm:max-w-[550px] md:max-w-[753px] xl:max-w-[1050px] w-full"
                                >
                                    <div
                                        id="slider-container"
                                        class="flex transition-transform duration-500 ease-out"
                                    >
                                        <!-- px-6 mb-6 -->
                                    </div>
                                </div>
                            </div>

                            <div
                                class="absolute bottom-5 xl:bottom-0 left-1/2 -translate-x-1/2 flex items-center justify-center gap-3"
                                id="indicatorContainer"
                            ></div>
                        </div>
                    </div>
                </section>

                <!-- ====================== TESTIMONIALS SECTION ====================== -->

                <!-- ====================== Sertificate Section ====================== -->
                <section>
                    <div class="container mx-auto px-4 md:px-6 lg:px-20 pb-12">
                        <div
                            class="max-[575px]:flex max-[575px]:flex-col max-[575px]:px-[0px] flex mt-[120px] py-4"
                        >
                            <div class="sm:px-[15px]">
                                <h6 id="sertificate-badge"></h6>
                                <h1 id="sertificate-title"></h1>
                                <p id="sertificate-description"></p>

                                <div
                                    class="flex items-center gap-10 mb-4"
                                    id="our-collaborations"
                                ></div>
                            </div>

                            <div id="certificaPart"></div>
                        </div>
                    </div>
                </section>

                <!-- ====================== Sertificate Section  ======================-->

                <!-- ====================== Subscribe Section ====================== -->
                <section
                    id="subscribe"
                    class="relative overflow-hidden bg-[url('../../Image/HomePagePhoto/subscribe-bg.png')] bg-cover bg-no-repeat bg-bottom"
                >
                    <div
                        class="container mx-auto px-5 md:px-10 lg:px-20 flex flex-col items-center justify-center pt-[96px]"
                    >
                        <div class="flex flex-col items-center mb-12">
                            <h6
                                class="font-bold leading-[150%] tracking-[1px] uppercase text-[#1E212C] mb-2"
                                id="subscribe-badge"
                            ></h6>
                            <h1
                                class="font-black leading-[130%] text-[#1E212C] max-w-[810px] text-center text-[34px] md:text-[37px] lg:text-[40px] xl:text-5xl pb-2"
                                id="subscribe-title"
                            ></h1>
                        </div>
                        <div id="inputContainer"></div>
                    </div>
                </section>
                <!-- ====================== Subscribe Section ====================== -->
            </main>

            <footer id="footer"></footer>

            <!-- loader -->
            <div
                id="loader"
                class="fixed top-0 left-0 z-30 w-full h-screen bg-white flex flex-col items-center justify-center gap-4"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="80"
                    height="80"
                    viewBox="0 0 24 24"
                >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <circle cx="12" cy="12" r="0" fill="currentColor">
                        <animate
                            id="SVG0cdVlcnN"
                            fill="freeze"
                            attributeName="r"
                            begin="0;SVGftllRbIv.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="0;11"
                        />
                        <animate
                            fill="freeze"
                            attributeName="opacity"
                            begin="0;SVGftllRbIv.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="1;0"
                        />
                    </circle>
                    <circle cx="12" cy="12" r="0" fill="currentColor">
                        <animate
                            id="SVGftllRbIv"
                            fill="freeze"
                            attributeName="r"
                            begin="SVG0cdVlcnN.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="0;11"
                        />
                        <animate
                            fill="freeze"
                            attributeName="opacity"
                            begin="SVG0cdVlcnN.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="1;0"
                        />
                    </circle>
                </svg>
                <p
                    class="font-[Lato] font-bold text-[20px] leading-[150%] text-[#787A80]"
                >
                    Loading...
                </p>
            </div>
            
        </div>

        <script type="module" src="courses.js"></script>
    </body>
</html>
