<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Events Single Page</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
        />
    </head>
    <style>
        body {
            font-family: "Lato", sans-serif;
        }
    </style>
    <body>
        <header
            class="w-full bg-transparent absolute z-20 top-0 left-0"
            id="headerMain"
        ></header>
        <main>
            <!-- *************** Hero section *************** -->
            <section
                class="bg-[url('../../../Image/HomePagePhoto/backgroundHero.svg')]"
            >
                <div
                    id="hero-container"
                    class="relative w-full max-w-[1340px] mx-auto px-5"
                >
                    <p id="hero-badge"></p>
                    <p id="hero-title"></p>
                </div>
            </section>

            <section
                id="TALKABOUT"
                class="w-full max-w-[1340px] mx-auto px-5 pt-[92px] pb-[48px]"
            ></section>

            <!-- *************** OTHER EVENTS SECTION *************** -->
            <div
                id="OtherEventsMain"
                class="bg-[rgb(241,241,241)] pt-[96px] pb-6 px-[15px]"
            ></div>
            <!-- *************** OTHER EVENTS SECTION *************** -->
        </main>
        <footer id="footer"></footer>

         <!-- loader -->
            <div
                id="loader"
                class="fixed top-0 left-0 z-30 w-full h-screen bg-white flex flex-col items-center justify-center gap-4"
            >
                <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="80"
                    height="80"
                    viewBox="0 0 24 24"
                >
                    <path d="M0 0h24v24H0z" fill="none" />
                    <circle cx="12" cy="12" r="0" fill="currentColor">
                        <animate
                            id="SVG0cdVlcnN"
                            fill="freeze"
                            attributeName="r"
                            begin="0;SVGftllRbIv.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="0;11"
                        />
                        <animate
                            fill="freeze"
                            attributeName="opacity"
                            begin="0;SVGftllRbIv.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="1;0"
                        />
                    </circle>
                    <circle cx="12" cy="12" r="0" fill="currentColor">
                        <animate
                            id="SVGftllRbIv"
                            fill="freeze"
                            attributeName="r"
                            begin="SVG0cdVlcnN.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="0;11"
                        />
                        <animate
                            fill="freeze"
                            attributeName="opacity"
                            begin="SVG0cdVlcnN.begin+0.6s"
                            calcMode="spline"
                            dur="1.2s"
                            keySplines=".52,.6,.25,.99"
                            values="1;0"
                        />
                    </circle>
                </svg>
                <p
                    class="font-[Lato] font-bold text-[20px] leading-[150%] text-[#787A80]"
                >
                    Loading...
                </p>
            </div>

        <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
        <script type="module" src="eventSingle.js"></script>
    </body>
</html>
