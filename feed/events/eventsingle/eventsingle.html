<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Events Single Page</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
        />
    </head>
    <style>
        body {
            font-family: "Lato", sans-serif;
        }
    </style>
    <body>
        <header
            class="w-full bg-transparent absolute top-0 left-0"
            id="headerMain"
        ></header>
        <main>
            <!-- *************** Hero section *************** -->
            <section
                class="bg-[url('../../../Image/HomePagePhoto/backgroundHero.svg')]"
            >
                <div
                    id="hero-container"
                    class="relative w-full max-w-[1340px] mx-auto px-5"
                >
                    <p id="hero-badge"></p>
                    <p id="hero-title"></p>
                </div>
            </section>

            <section
                id="TALKABOUT"
                class="w-full max-w-[1340px] mx-auto px-5 pt-[92px] pb-[48px]"
            ></section>

            <!-- *************** OTHER EVENTS SECTION *************** -->
            <div
                id="OtherEventsMain"
                class="bg-[rgb(241,241,241)] pt-[96px] pb-6 px-[15px]"
            ></div>
            <!-- *************** OTHER EVENTS SECTION *************** -->
        </main>
        <footer id="footer"></footer>

        <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
        <script type="module" src="eventSingle.js"></script>
    </body>
</html>
