<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="about.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
        />
        <style>
            body {
                font-family: "Lato", sans-serif;
            }
            :lang(ru) h1,
            :lang(ru) h2,
            :lang(ru) h3,
            :lang(ru) h4,
            :lang(ru) h5,
            :lang(ru) h6,
            :lang(ru) a,
            :lang(ru) span,
            :lang(ru) button,
            :lang(ru) li,
            :lang(ru) p {
                font-family: "Montserrat", sans-serif;
            }
        </style>
    </head>
    <body>
        <header id="headerMain" class="w-full bg-transparent z-10"></header>
        <main>
            <!-- section 1 -->
            <section id="hero"></section>
            <a href="../../feed/events/events.html"></a>
            <!-- section 2 -->
            <section
                id="section2"
                class="w-full max-w-[1340px] mx-auto px-5 mb-5 md:mb-20"
            ></section>
            <!-- section 3 -->
            <section
                id="section3"
                class="w-full max-w-[1340px] mx-auto px-5 mb-5 mt-8 md:mt-24 md:mb-24"
            ></section>
            <!-- our main direction -->
            <section
                id="ourMainDirection"
                class="w-full max-w-[1340px] mx-auto px-5 mb-10"
            ></section>
            <!-- studying process -->
            <section
                id="studyingProcess"
                class="w-full max-w-[1340px] mx-auto px-5 flex flex-col-reverse text-left items-center mt-8 mb-10 md:flex md:flex-row md:justify-between md:mt-14 md:mb-14 lg:mt-20 lg:mb-24"
            ></section>
            <!-- best tutors -->
            <section
                id="bestTutors"
                class="w-full max-w-[1340px] mx-auto px-5 mb-8 md:mb-16"
            ></section>
            <!-- testimonials -->
            <section
                id="testimonials"
                class="py-10 bg-[url('../../Image/aboutUs-photo/Background.png')] bg-contain bg-center h-auto"
            ></section>
            <!-- best jobs -->
            <section
                id="bestJobs"
                class="py-10 bg-[url('../../Image/aboutUs-photo/Background.png')] bg-contain bg-center h-auto"
            ></section>
            <!-- our blog -->
            <section id="ourBlog" class="pt-28 pb-44"></section>
            <!-- Subscribe Section-->
            <section
                id="subscribe"
                class="relative overflow-hidden bg-[url('../../Image/HomePagePhoto/subscribe-bg.png')] bg-cover bg-no-repeat bg-bottom"
            ></section>
        </main>
        <footer id="footer"></footer>
        <div
            id="loader"
            class="fixed top-0 left-0 z-30 w-full h-screen bg-white flex flex-col items-center justify-center gap-4"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="80"
                height="80"
                viewBox="0 0 24 24"
            >
                <path d="M0 0h24v24H0z" fill="none" />
                <circle cx="12" cy="12" r="0" fill="currentColor">
                    <animate
                        id="SVG0cdVlcnN"
                        fill="freeze"
                        attributeName="r"
                        begin="0;SVGftllRbIv.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="0;11"
                    />
                    <animate
                        fill="freeze"
                        attributeName="opacity"
                        begin="0;SVGftllRbIv.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="1;0"
                    />
                </circle>
                <circle cx="12" cy="12" r="0" fill="currentColor">
                    <animate
                        id="SVGftllRbIv"
                        fill="freeze"
                        attributeName="r"
                        begin="SVG0cdVlcnN.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="0;11"
                    />
                    <animate
                        fill="freeze"
                        attributeName="opacity"
                        begin="SVG0cdVlcnN.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="1;0"
                    />
                </circle>
            </svg>
            <p
                class="font-[Lato] font-bold text-[20px] leading-[150%] text-[#787A80]"
            >
                Loading...
            </p>
        </div>
        <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
        <script type="module" src="about.js"></script>
    </body>
</html>
