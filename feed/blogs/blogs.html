<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Blog</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
        />
        <style>
            body {
                font-family: "Lato", sans-serif;
            }
            :lang(ru) h1,
            :lang(ru) h2,
            :lang(ru) h3,
            :lang(ru) h4,
            :lang(ru) h5,
            :lang(ru) h6,
            :lang(ru) a,
            :lang(ru) span,
            :lang(ru) button,
            :lang(ru) li,
            :lang(ru) p {
                font-family: "Montserrat", sans-serif;
            }
            button,
            a,
            input {
                outline: none;
                cursor: pointer;
            }
        </style>
    </head>
    <body>
        <header id="headerMain" class="w-full bg-transparent z-10"></header>
        <main>
            <section id="blog"></section>
            <section id="subscribe" class="bg-[#F4F5F6]"></section>
        </main>
        <footer id="footer"></footer>
        <div
            id="loader"
            class="fixed top-0 left-0 z-30 w-full h-screen bg-white flex flex-col items-center justify-center gap-4"
        >
            <svg
                xmlns="http://www.w3.org/2000/svg"
                width="80"
                height="80"
                viewBox="0 0 24 24"
            >
                <path d="M0 0h24v24H0z" fill="none" />
                <circle cx="12" cy="12" r="0" fill="currentColor">
                    <animate
                        id="SVG0cdVlcnN"
                        fill="freeze"
                        attributeName="r"
                        begin="0;SVGftllRbIv.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="0;11"
                    />
                    <animate
                        fill="freeze"
                        attributeName="opacity"
                        begin="0;SVGftllRbIv.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="1;0"
                    />
                </circle>
                <circle cx="12" cy="12" r="0" fill="currentColor">
                    <animate
                        id="SVGftllRbIv"
                        fill="freeze"
                        attributeName="r"
                        begin="SVG0cdVlcnN.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="0;11"
                    />
                    <animate
                        fill="freeze"
                        attributeName="opacity"
                        begin="SVG0cdVlcnN.begin+0.6s"
                        calcMode="spline"
                        dur="1.2s"
                        keySplines=".52,.6,.25,.99"
                        values="1;0"
                    />
                </circle>
            </svg>
            <p
                class="font-[Lato] font-bold text-[20px] leading-[150%] text-[#787A80]"
            >
                Loading...
            </p>
        </div>
        <script type="module" src="./blogs.js"></script>
    </body>
</html>
