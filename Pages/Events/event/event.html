<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Events Grid View</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
    </head>
    <style>
        body {
            font-family: "Lato", sans-serif;
        }
    </style>
    <body>
        <div>
            <header
                class="w-full bg-transparent absolute top-0 left-0"
                id="headerMain"
            ></header>
            <main>
                <section id="EVENTS-LIST-VIEW"></section>

                <section
                    id="subscribe"
                    class="relative overflow-hidden bg-[url('../../../Image/HomePagePhoto/subscribe-bg.png')] bg-cover bg-no-repeat bg-bottom"
                >
                    <div
                        class="container mx-auto px-5 md:px-10 lg:px-20 flex flex-col items-center justify-center pt-[96px]"
                    >
                        <div class="flex flex-col items-center mb-12">
                            <h6
                                class="font-bold leading-[150%] tracking-[1px] uppercase text-[#1E212C] mb-2"
                                id="subscribe-badge"
                            ></h6>
                            <h1
                                class="font-black leading-[130%] text-[#1E212C] max-w-[810px] text-center text-[34px] md:text-[37px] lg:text-[40px] xl:text-5xl pb-2"
                                id="subscribe-title"
                            ></h1>
                        </div>
                        <div id="inputContainer"></div>
                    </div>
                </section>
            </main>

            <footer id="footer"></footer>
        </div>

        <script type="module" src="./event.js"></script>
    </body>
</html>
