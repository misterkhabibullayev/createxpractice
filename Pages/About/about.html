<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="about.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
        />
    </head>
    <body>
        <header id="headerMain" class="w-full bg-transparent z-10"></header>
        <main>
            <!-- section 1 -->
            <section id="heroSection"></section>

            <!-- section 2 -->
            <section
                id="section2"
                class="container mx-auto px-5 md:px-10 mb-5 md:mb-20 lg:px-15"
            ></section>
            <!-- section 3 -->
            <section
                id="section3"
                class="container mx-auto px-5 mb-5 mt-8 md:px-10 md:mt-24 md:mb-24 lg:px-15"
            ></section>

            <!-- our main direction -->
            <section
                id="ourMainDirection"
                class="container mx-auto px-5 mb-10 md:px-10 lg:px-15"
            ></section>

            <!-- studying process -->
            <section
                id="studyingProcess"
                class="container mx-auto px-5 flex flex-col-reverse text-left items-center mt-8 mb-10 md:flex md:flex-row md:justify-between md:px-10 md:mt-14 md:mb-14 lg:px-15 lg:mt-20 lg:mb-24"
            ></section>

            <!-- best tutors -->
            <section
                id="bestTutors"
                class="container mx-auto px-5 mb-8 md:mb-16 md:px-10 lg:px-15"
            ></section>

            <!-- testimonials -->
            <section
                id="testimonials"
                class="py-10 bg-[url('../../Image/aboutUs-photo/Background.png')] bg-contain bg-center h-auto"
            ></section>
            <!-- best jobs -->
            <section
                id="bestJobs"
                class="py-10 bg-[url('../../Image/aboutUs-photo/Background.png')] bg-contain bg-center h-auto"
            ></section>
            <!-- our blog -->
            <section
                id="ourBlog"
                class="container mx-auto px-5 my-5 md:my-16 md:px-10 lg:px-15"
            ></section>
            <!-- subscribe -->
            <section id="subscribe">
                <div class="bg-[#F9DCD6] h-auto pt-20 pb-36">
                    <div class="mx-auto items-center text-center mb-5 md:mb-8">
                        <h6
                            class="font-[Lato] text-[#1E212C] font-bold text-base leading-[150%]"
                        >
                            DON`T MISS ANYTHING
                        </h6>
                        <h1
                            class="font-[Lato] mx-auto text-[#1E212C] font-extrabold text-xl max-w-2xl sm:leading-[130%] sm:text-3xl lg:font-black lg:text-4xl"
                        >
                            Subscribe to the Createx School announcements
                        </h1>
                    </div>
                    <form
                        action="#"
                        class="mx-auto items-center text-center mt-10"
                    >
                        <input
                            type="email"
                            placeholder="Your working email"
                            class="border border-[#D7DADD] py-3 pl-4 pr-40 outline-none rounded"
                        />
                        <button
                            class="bg-[#F75E05] text-[#ffffff] outline-none py-3 px-7 rounded"
                        >
                            Subscribe
                        </button>
                    </form>
                </div>
            </section>
        </main>
        <footer></footer>
        <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
        <script type="module" src="about.js"></script>
    </body>
</html>
