<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>About</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="about.css" />
        <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.css"
        />
    </head>
    <body class="font-[Lato]">
        <header id="headerMain" class="w-full bg-transparent z-10"></header>
        <main>
            <!-- section 1 -->
            <section id="hero"></section>

            <!-- section 2 -->
            <section
                id="section2"
                class="w-full max-w-[1300px] mx-auto px-5 mb-5 md:mb-20"
            ></section>
            <!-- section 3 -->
            <section
                id="section3"
                class="w-full max-w-[1300px] mx-auto px-5 mb-5 mt-8 md:mt-24 md:mb-24"
            ></section>
            <!-- our main direction -->
            <section
                id="ourMainDirection"
                class="w-full max-w-[1300px] mx-auto px-5 mb-10"
            ></section>
            <!-- studying process -->
            <section
                id="studyingProcess"
                class="w-full max-w-[1300px] mx-auto px-5 flex flex-col-reverse text-left items-center mt-8 mb-10 md:flex md:flex-row md:justify-between md:mt-14 md:mb-14 lg:mt-20 lg:mb-24"
            ></section>
            <!-- best tutors -->
            <section
                id="bestTutors"
                class="w-full max-w-[1300px] mx-auto px-5 mb-8 md:mb-16"
            ></section>
            <!-- testimonials -->
            <section
                id="testimonials"
                class="py-10 bg-[url('../../Image/aboutUs-photo/Background.png')] bg-contain bg-center h-auto"
            ></section>
            <!-- best jobs -->
            <section
                id="bestJobs"
                class="py-10 bg-[url('../../Image/aboutUs-photo/Background.png')] bg-contain bg-center h-auto"
            ></section>
            <!-- our blog -->
            <section id="ourBlog" class="pt-28 pb-44"></section>
            <!-- Subscribe Section-->
            <section
                id="subscribe"
                class="relative overflow-hidden bg-[url('../../Image/HomePagePhoto/subscribe-bg.png')] bg-cover bg-no-repeat bg-bottom"
            ></section>
        </main>
        <footer id="footer"></footer>
        <script src="https://cdn.jsdelivr.net/npm/swiper@14.0.1/swiper-bundle.min.js"></script>
        <script type="module" src="about.js"></script>
    </body>
</html>
